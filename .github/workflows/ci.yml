name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUB_TOKEN }}
          fetch-depth: 2

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Start backing services
        run: docker compose -f resources/docker-compose.yml up -d

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker exec short-link-mysql mysqladmin ping -h localhost -u short_link -plocal-dev --silent 2>/dev/null; then
              echo "MySQL ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL failed to start"
          docker compose -f resources/docker-compose.yml logs
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if docker exec short-link-redis redis-cli -a local-dev ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
          echo "Redis failed to start"
          docker compose -f resources/docker-compose.yml logs
          exit 1

      # CI tests run against the bundled GeoLite2-City-Fallback.mmdb so we don't burn
      # MaxMind's daily download quota on every PR. Production downloads use the key.
      # The coverage gate waits for the `build` job, which sees every job's execution data.
      - run: ./gradlew test -PdockerHttpForks=1 -x jacocoTestReport
        env:
          RATCHET_BASE: HEAD^1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload coverage data and evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-test
          path: |
            build/jacoco/test.exec
            build/reports/commit-listeners/
          if-no-files-found: error

      - name: Stop backing services
        if: always()
        run: docker compose -f resources/docker-compose.yml down -v

  docker-http:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew dockerHttpTest -PdockerHttpForks=1 -PdockerHttpShard=${{ matrix.slice }}/3

      - name: Name this slice's coverage data
        run: mv build/jacoco/dockerHttpTest.exec build/jacoco/dockerHttpTest-${{ matrix.slice }}.exec

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-docker-http-${{ matrix.slice }}
          path: build/reports/tests/

      - name: Upload coverage data and evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-docker-http-${{ matrix.slice }}
          path: |
            build/jacoco/dockerHttpTest-${{ matrix.slice }}.exec
            build/reports/commit-listeners/
            build/reports/query-audit/http-contracts/
          if-no-files-found: error

  mutation-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew pitest

      - name: Upload mutation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-packages
          path: build/reports/pitest/

  build:
    needs: [test, docker-http, mutation-packages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # A skipped required check counts as passing, so this job runs even when a needed job
      # failed and fails here instead.
      - name: Require the test and mutation jobs
        if: ${{ needs.test.result != 'success' || needs.docker-http.result != 'success' || needs.mutation-packages.result != 'success' }}
        run: exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew spotlessCheck

      - name: Collect coverage data and evidence from the test jobs
        uses: actions/download-artifact@v8
        with:
          pattern: evidence-*
          path: build
          merge-multiple: true

      - run: ./gradlew jacocoTestReport verifyHttpEndpointCoverage verifyCommitListenerDelivery -x test -PcollectedEvidence

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false

      - name: Upload HTTP query contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-query-contracts
          path: build/reports/query-audit/http-contracts/
          if-no-files-found: warn

      - run: ./gradlew build -x test -x spotlessCheck

      - name: Scan runtime dependencies for known vulnerabilities
        run: |
          ./gradlew --init-script config/osv/lockfile.gradle dependencies --configuration runtimeClasspath --write-locks --quiet > /dev/null
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan --config=config/osv/osv-scanner.toml --lockfile=build/osv/gradle.lockfile

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew pitest -PmutationScope=core

      - name: Upload mutation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-core
          path: build/reports/pitest-core/
