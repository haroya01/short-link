name: prod-resource-read (temporary)

# 운영 박스의 메모리·디스크·표 크기·요청 수를 읽기만 한다. 공개 저장소라 결과는 암호문으로만 로그에 남는다.
on:
  push:
    branches: [chore/prod-resource-read]

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read resource numbers
        uses: appleboy/ssh-action@v1
        env:
          PUB_B64: 
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PUB_B64
          script: |
            set -u
            out=$(mktemp); k=$(mktemp); ng_log=$(mktemp)
            svc() { docker ps -q --filter "label=com.docker.compose.service=$1" | head -1; }
            {
            echo "## when"; date -u +%FT%TZ; uptime
            echo "## host"; echo "cpus: $(nproc)"; free -m; df -h / | tail -1
            T=$(curl -s -m 2 -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60" || true)
            echo "instance-type: $(curl -s -m 2 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/instance-type || echo unknown)"
            echo "## docker stats"
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.PIDs}}'
            echo "## container log sizes"
            for c in $(docker ps -q); do echo "$(docker inspect --format '{{.Name}}' "$c") $(sudo -n du -h "$(docker inspect --format '{{.LogPath}}' "$c")" 2>/dev/null | cut -f1)"; done
            echo "## app process"
            docker exec "$(svc app)" sh -c 'grep -E "VmRSS|VmHWM|Threads" /proc/1/status; tr "\0" " " < /proc/1/cmdline | cut -c1-300; echo'
            echo "## mysql tables (estimated rows, MB)"
            docker exec "$(svc mysql)" sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT table_name, table_rows, ROUND((data_length+index_length)/1048576,1) FROM information_schema.tables WHERE table_schema = \"short_link\" ORDER BY (data_length+index_length) DESC LIMIT 30" 2>/dev/null'
            echo "## mysql status"
            docker exec "$(svc mysql)" sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SHOW GLOBAL STATUS WHERE Variable_name IN (\"Threads_connected\",\"Max_used_connections\",\"Questions\",\"Uptime\",\"Slow_queries\",\"Innodb_buffer_pool_bytes_data\"); SHOW VARIABLES WHERE Variable_name IN (\"innodb_buffer_pool_size\",\"max_connections\")" 2>/dev/null'
            echo "## redis"
            docker exec "$(svc redis)" sh -c 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning info memory | grep -E "^(used_memory_human|used_memory_peak_human|maxmemory_human)"; redis-cli -a "$REDIS_PASSWORD" --no-auth-warning dbsize'
            docker logs --since 24h "$(svc nginx)" > "$ng_log" 2>/dev/null
            echo "## nginx 24h: lines $(wc -l < "$ng_log")"
            echo "## nginx 24h: method path status (top 50)"
            awk -F'"' 'NF>=7 { split($2,r," "); m=r[1]; p=r[2]; sub(/\?.*/,"",p); n=split(p,s,"/"); a=s[2];
              if (a !~ /^(api|ap|\.well-known|nodeinfo|inbox|users|notes|actuator|federation)$/) key="/{other}";
              else { key="/" a; prev=a;
                for (i=3; i<=n && i<=8; i++) { g=s[i];
                  if (g ~ /^[0-9]+$/ || length(g)>24 || prev ~ /^(users|profiles|tags|tag|links|u|p|codes)$/) g="{x}";
                  key=key "/" g; prev=s[i] } }
              split($3,t," "); print m, key, substr(t[1],1,1) "xx" }' "$ng_log" | sort | uniq -c | sort -rn | head -50
            echo "## nginx 24h: requests per hour (server time)"
            awk -F'[][]' 'NF>=3 { split($2,d,":"); print d[2] }' "$ng_log" | sort | uniq -c | tr '\n' ' '; echo
            echo "## nginx 24h: user agents (top 15, first token)"
            awk -F'"' 'NF>=7 { ua=$6; sub(/[\/ ].*/,"",ua); print ua }' "$ng_log" | sort | uniq -c | sort -rn | head -15
            } > "$out" 2>&1
            openssl rand -hex 32 > "$k"
            echo "$PUB_B64" | base64 -d > "$k.pub"
            echo "-----K-----"
            openssl pkeyutl -encrypt -pubin -inkey "$k.pub" -pkeyopt rsa_padding_mode:oaep -in "$k" | base64 -w0; echo
            echo "-----D-----"
            gzip -c "$out" | openssl enc -aes-256-cbc -pbkdf2 -md sha256 -iter 10000 -pass "file:$k" | base64 -w76
            echo "-----E-----"
            rm -f "$out" "$k" "$k.pub" "$ng_log"
