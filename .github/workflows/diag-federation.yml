name: diag-federation

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read federation logs and rows (read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/short-link/deploy
            echo "== app log (federation, last 2h)"
            docker compose logs app --since 2h 2>&1 | grep -iE "federation|inbox|deliver|signature|activitypub|/ap/" | grep -viE "password|secret|token" | tail -n 150
            echo "== rows"
            docker compose exec -T mysql sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "${MYSQL_DATABASE:-short_link}" -e "
              SELECT id, user_id, remote_actor_id, follow_activity_id, created_at FROM federation_follower ORDER BY id DESC LIMIT 10;
              SELECT id, actor_uri, inbox, shared_inbox, domain, fetched_at FROM federation_remote_actor ORDER BY id DESC LIMIT 10;
              SELECT id, signer_user_id, activity_id, inbox, attempts, last_status, LEFT(last_error, 300) AS last_error, next_attempt_at, created_at FROM federation_delivery ORDER BY id DESC LIMIT 20;
            "' 2>&1 | grep -v "Using a password"
