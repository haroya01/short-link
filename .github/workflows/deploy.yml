name: Deploy

on:
  # main 머지는 배포가 아니다. v* 태그를 푸시할 때만 내보낸다.
  # 버전: vYYYY.MM.DD, 같은 날 두 번째부터 vYYYY.MM.DD.N (N = 2, 3, …).
  # workflow_dispatch 는 이미 있는 태그를 다시 내보낸다(되돌리기).
  # 태그 커밋이 origin/main 에 있고, 그 커밋(main CI)이나 트리가 같은 PR head 에 build 체크 성공이 있어야
  # 내보낸다. main CI 가 아직 돌고 있으면 40분까지 기다리고, 그래도 검증이 안 되면 내보내지 않는다.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to deploy (vYYYY.MM.DD or vYYYY.MM.DD.N)
        required: true
        type: string

concurrency:
  # 태그마다 ref 가 달라서 ref 로 묶으면 두 태그가 동시에 나갈 수 있다. 배포는 하나씩.
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  checks: read
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag and verify its commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          api() {
            for _ in 1 2 3 4 5; do
              gh api "$@" && return 0
              sleep 3
            done
            return 1
          }
          if ! [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag. Use vYYYY.MM.DD, or vYYYY.MM.DD.N for another release the same day."
            exit 1
          fi
          if ! sha=$(git rev-parse --verify -q "refs/tags/$TAG^{commit}"); then
            echo "::error::Tag $TAG does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$TAG points at $sha, which is not on origin/main. Only commits on main ship."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "$TAG -> $sha"

          head=""
          passed=0
          pr=$(git log -1 --format=%s "$sha" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
          if [ -n "$pr" ]; then
            head=$(api "repos/$REPO/pulls/$pr" -q "select(.merge_commit_sha == \"$sha\") | .head.sha") || head=""
          fi
          if [ -n "$head" ]; then
            head_tree=$(api "repos/$REPO/git/commits/$head" -q .tree.sha) || head_tree=""
            passed=$(api "repos/$REPO/commits/$head/check-runs?check_name=build" -q '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length') || passed=0
            if [ "$head_tree" = "$(git rev-parse "$sha^{tree}")" ] && [ "${passed:-0}" -gt 0 ]; then
              echo "Verified: PR #$pr head $head has the same tree and a successful build."
              exit 0
            fi
          fi
          echo "PR #${pr:-none} head ${head:-none} (passed ${passed:-0}) does not verify $sha; checking main CI on $sha."

          deadline=$(( $(date +%s) + 40 * 60 ))
          while :; do
            runs=$(api "repos/$REPO/commits/$sha/check-runs?check_name=build" -q '[.check_runs[] | select(.app.slug == "github-actions")]') || runs=""
            if [ -n "$runs" ]; then
              total=$(jq 'length' <<< "$runs")
              succeeded=$(jq '[.[] | select(.conclusion == "success")] | length' <<< "$runs")
              running=$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")
              if [ "$succeeded" -gt 0 ]; then
                echo "Verified: build succeeded on $sha."
                exit 0
              fi
              if [ "$total" -gt 0 ] && [ "$running" -eq 0 ]; then
                echo "::error::build on $sha finished without success ($(jq -r 'map(.conclusion) | join(", ")' <<< "$runs")). Not deploying unverified. Re-run CI on $sha or tag a verified commit."
                exit 1
              fi
              echo "build on $sha: $total run(s), $running still running."
            else
              echo "build on $sha: no check-run yet."
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No successful build on $sha, or on a PR head with the same tree, within 40 minutes. Not deploying unverified."
              exit 1
            fi
            sleep 30
          done

  build-and-deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          build-args: |
            MAXMIND_LICENSE_KEY=${{ secrets.MAXMIND_LICENSE_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.release.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,APNS_TEAM_ID,APNS_KEY_ID,APNS_PRIVATE_KEY,RELEASE_SHA
          script_stop: true
          script: |
            set -e
            cd ~/short-link
            # pull --ff-only 는 서버 체크아웃이 한 번이라도 diverge 하면(과거 수동 커밋·force-push
            # 잔재) 영구히 실패한다 — 배포 박스의 워킹트리는 어차피 origin/main 의 사본이어야 하므로
            # 원격 상태로 강제 동기화한다. reset --hard 는 tracked 파일만 만지므로 서버의 .env 등
            # untracked 설정은 그대로다.
            git fetch origin main
            # CI 가 통과시킨 그 커밋. 대기 중 main 이 앞서 나가면 설정과 이미지가 섞인다.
            git reset --hard "$RELEASE_SHA"
            cd deploy
            # compose 는 셸 환경을 .env 보다 우선한다 — latest 대신 검증된 이미지를 받는다.
            export APP_IMAGE_TAG="sha-$RELEASE_SHA"
            # APNs 푸시 설정을 서버 .env 에 upsert — 값은 GH Actions 시크릿에서 온다(로그 미출력).
            # docker-compose 가 이 .env 를 읽어 컨테이너 env(APNS_*)로 넣고, ApnsPushSender 가
            # BEGIN/END·공백을 벗겨 PKCS8 로 디코드한다(그래서 base64 한 줄이면 충분). production=true 로
            # TestFlight/스토어 토큰이 실제 게이트웨이(api.push.apple.com)로 간다.
            set_env() {
              local k="$1" v="$2" f=.env
              touch "$f"
              grep -v "^${k}=" "$f" > "$f.tmp" 2>/dev/null || true
              printf '%s=%s\n' "$k" "$v" >> "$f.tmp"
              mv "$f.tmp" "$f"
            }
            set_env APNS_TEAM_ID "$APNS_TEAM_ID"
            set_env APNS_KEY_ID "$APNS_KEY_ID"
            set_env APNS_PRIVATE_KEY "$APNS_PRIVATE_KEY"
            set_env APNS_PRODUCTION true
            # GHCR package is private; auth before pull, then drop the token from the EC2's
            # docker config so the credential isn't sitting on disk after we're done.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u haroya01 --password-stdin
            # 배포마다 받는 sha 태그 이미지는 dangling 이 아니라서 -f 만으로는 지워지지 않고 쌓인다.
            # -a 로 돌고 있지 않은 이미지를 받기 전과 뒤에 비운다(되돌리기는 GHCR 에서 다시 받는다).
            docker image prune -af
            df -h /
            docker compose pull app
            docker compose up -d --no-build --pull never
            # Now safe to drop the credential — no more pulls until next deploy.
            docker logout ghcr.io
            docker image prune -af
            # Wait for healthy so a crash-looping container is not reported as a green deploy.
            # 'unhealthy' 안에 'healthy' 가 들어 있어서, 문자열 매칭은 크래시 루프를 초록으로
            # 읽는다 — 이 대기가 막으려던 바로 그 상황이다. 상태를 정확히 비교한다.
            for i in $(seq 1 30); do
              cid=$(docker compose ps -q app)
              health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo missing)
              if [ "$health" = healthy ]; then
                echo "app healthy after ${i} attempts"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "app failed to become healthy"
                docker compose logs app --tail 50
                exit 1
              fi
              sleep 4
            done
            # nginx caches the app container's IP at worker boot. When `compose up -d`
            # recreates the app container its IP can shift inside the compose network,
            # and nginx will keep proxying the stale IP — every /api, /oauth2 call
            # returns 502 until reload. Reload is graceful and re-resolves upstream
            # without dropping in-flight requests.
            docker compose exec -T nginx nginx -s reload
            docker compose ps
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_RO_TOKEN }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}

      - name: Notify Discord — deploy success
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          MSG=$(jq -nc \
            --arg release "$RELEASE_TAG ${RELEASE_SHA:0:7}" \
            --arg msg "$(git log -1 --pretty=%s)" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{ content: "✅ **BE deploy success** · \($release) — \($msg)\n<\($run)>" }')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$MSG" "$WEBHOOK"

      - name: Notify Discord — deploy failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          MSG=$(jq -nc \
            --arg release "$RELEASE_TAG ${RELEASE_SHA:0:7}" \
            --arg msg "$(git log -1 --pretty=%s)" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{ content: "🚨 **BE deploy FAILED** · \($release) — \($msg)\n<\($run)>" }')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$MSG" "$WEBHOOK" || true
