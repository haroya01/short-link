spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # 풀이 비어 있을 때 30초를 매달리는 대신 10초에 끊어 빨리 실패시킨다(스케줄 잡·요청 모두).
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      # 커넥션을 20초 넘게 쥐고 있으면 보유 스택을 WARN 으로 남긴다. 정상 트랜잭션은
      # 20초를 넘지 않으므로 오탐 없이, 풀을 비운 호출만 스택과 함께 드러난다.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:20000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

server:
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

# API docs map the entire endpoint surface — keep them off the public prod host. The SecurityConfig
# matcher already gates them to ADMIN; this removes the routes outright.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:prod}
  release: ${SENTRY_RELEASE:}
  traces-sample-rate: 0.1
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

short-link:
  base-url: ${SHORT_LINK_BASE_URL}
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
  cookie:
    secure: true
    domain: ${COOKIE_DOMAIN:.kurl.me}
    same-site: ${COOKIE_SAME_SITE:Lax}
  # Refresh-cookie requests come from the apex, the blog, and every author subdomain.
  # `https://*.kurl.me` is an origin pattern that covers the subdomains; the apex needs its own entry.
  # When CORS_ALLOWED_ORIGINS is set it must include both.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://kurl.me,https://*.kurl.me}
