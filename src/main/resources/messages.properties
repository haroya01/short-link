# Link insight messages (default = English). Args are pre-formatted strings from LinkInsights.
# {0}.. positional. Percent values arrive without the % sign; the % is literal in the template.
insight.velocity=Being clicked at {0}× the usual pace right now
insight.trendUp=Clicks in the last 7 days rose {0}% from the 7 days before ({1} clicks)
insight.trendDown=Clicks in the last 7 days fell {0}% from the 7 days before ({1} clicks)
insight.peakDay=The busiest day was {0}, with {1} clicks
insight.topSource={0} brought {1}% of your traffic
insight.channelLoyalty={1}% of the people from {0} came back
insight.inAppBrowser={0}% of clicks opened in an in-app browser
insight.peakHour=Busiest around {0}:00
insight.returning={0}% of visitors came back
insight.returningRecent={0}% of visitors in the last {1} days came back
insight.topCountry={1}% arrived from {0}
insight.mobileHeavy={0}% of clicks came from mobile
insight.desktopHeavy={0}% of clicks came from desktop
insight.botHigh=Automated traffic is {0}% · {1} human clicks
insight.botFiltered=Excluding {0}% automated traffic leaves {1} human clicks
insight.fastFirstClick=First click landed {0} min after creation

