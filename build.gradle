plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
	id 'net.ltgt.errorprone' version '5.1.1'
	id 'pmd'
	id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework:spring-aspects'
	implementation 'org.aspectj:aspectjweaver'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
	implementation 'nl.basjes.parse.useragent:yauaa:7.30.0'
	implementation 'com.maxmind.geoip2:geoip2:4.2.1'
	implementation 'org.apache.commons:commons-compress:1.28.0'
	implementation 'org.jsoup:jsoup:1.23.2'
	implementation 'com.google.zxing:core:3.5.4'
	implementation 'com.google.zxing:javase:3.5.4'
	implementation 'nl.martijndwars:web-push:5.1.1'
	// web-push 5.1.1 declares BouncyCastle as provided — pull it explicitly (VAPID key parsing / ECDH).
	implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
	implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
	implementation 'io.github.resilience4j:resilience4j-micrometer:2.2.0'
	implementation platform('software.amazon.awssdk:bom:2.57.3')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:auth'
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	implementation 'io.sentry:sentry-spring-boot-4-starter:8.41.0'
	implementation 'io.sentry:sentry-logback:8.41.0'
	implementation 'org.apache.datasketches:datasketches-java:6.2.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'net.logstash.logback:logstash-logback-encoder:9.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'io.github.haroya01:query-audit-spring-boot-starter:0.7.2'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testImplementation 'io.github.haroya01:query-audit-mysql:0.7.2'
	// The HTTP capture helper calls QueryInterceptor directly (datasource-proxy is runtime-only upstream).
	testImplementation 'net.ttddyy:datasource-proxy:1.10'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	errorprone 'com.google.errorprone:error_prone_core:2.51.0'
}

tasks.named('compileJava') {
	options.compilerArgs += ['-Xmaxwarns', '100000']
	options.errorprone.disableWarningsInGeneratedCode = true
}

tasks.named('compileTestJava') {
	options.errorprone.enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
	maxHeapSize = '2g'
	systemProperty 'short-link.main-classpath', sourceSets.main.runtimeClasspath.asPath
	systemProperty 'api-shape.update', providers.gradleProperty('updateApiShape').isPresent()
	inputs.files('deploy/docker-compose.yml', 'deploy/.env.example', 'Dockerfile')
	finalizedBy jacocoTestReport
	outputs.dir 'build/reports/query-audit/http-contracts'
	doFirst { delete 'build/reports/query-audit/http-contracts' }
}

tasks.register('httpQueryContractTest', Test) {
	group = 'verification'
	description = 'Verify real HTTP SQL contracts against disposable Docker MySQL and Redis.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeEngines 'junit-jupiter'
	}
	filter {
		includeTestsMatching '*HttpQueryContractTest'
	}
	maxHeapSize = '2g'
	outputs.dir 'build/reports/query-audit/http-contracts'
	doFirst { delete 'build/reports/query-audit/http-contracts' }
	finalizedBy 'verifyHttpEndpointCoverage'
}

tasks.register('verifyHttpEndpointCoverage') {
	group = 'verification'
	description = 'Fail when an active application HTTP handler has no successful user-journey request.'
	mustRunAfter 'test', 'httpQueryContractTest'
	onlyIf { tasks.test.state.failure == null && tasks.httpQueryContractTest.state.failure == null }
	doLast {
		if (!gradle.taskGraph.hasTask(tasks.test) && !gradle.taskGraph.hasTask(tasks.httpQueryContractTest)) {
			throw new GradleException('Run httpQueryContractTest, or test verifyHttpEndpointCoverage, so the evidence matches the tested code.')
		}
		def evidence = file('build/reports/query-audit/http-contracts')
		def inventory = new groovy.json.JsonSlurper().parse(new File(evidence, 'endpoint-inventory.json'))
		def requests = fileTree(new File(evidence, 'routes')).matching { include '*.json' }.files.collect {
			new groovy.json.JsonSlurper().parse(it)
		}
		def reached = requests.findAll { it.status >= 200 && it.status < 400 }.collect { it.handler }.toSet()
		def missing = inventory.findAll { !reached.contains(it.handler) }
		def summary = [handlers: inventory.size(), covered: inventory.size() - missing.size(), missing: missing]
		new File(evidence, 'endpoint-coverage.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(summary))
		if (!missing.isEmpty()) {
			throw new GradleException("Missing successful HTTP journeys for ${missing.size()} handlers: " + missing.collect { it.handler }.join(', '))
		}
		logger.lifecycle("HTTP endpoint coverage: ${inventory.size()}/${inventory.size()} active application handlers")
	}
}

jacoco {
	toolVersion = '0.8.12'
}

// Shared between the coverage report and the coverage-verification gate so the
// measured metric and the enforced metric never drift apart.
def coverageClassExcludes = [
				'com/example/short_link/ShortLinkApplication.class',
				'com/example/short_link/common/config/**',
				'db/migration/**',
				// Auto-generated record canonical methods (equals/hashCode/canEqual) and
				// constructor-only DTOs / commands carry branches that mean nothing as behavior —
				// excluding them lets the metric reflect actual logic coverage.
				'**/presentation/request/**',
				'**/presentation/response/**',
				'**/application/dto/**',
				'**/application/write/*Command.class',
				'**/application/write/*Command$*.class',
				'**/application/read/*View.class',
				'**/application/properties/**',
				'**/*Properties.class',
				'**/*Properties$*.class',
				'**/exception/*ErrorCode.class',
				'**/exception/*ErrorCode$*.class',
				'**/exception/*Exception.class',
				// External-integration adapters — branches here are dominated by retry/backoff
				// paths that need real network conditions to hit.
				'**/audit/**',
				'**/geoip/scheduler/**',
				'**/storage/s3/S3StorageConfig*.class',
				// Pure infrastructure adapters with mostly JPA wiring.
				'**/infrastructure/persistence/**',
				// Admin dashboard aggregators read live metric/runtime state — branches here
				// are dominated by null/missing-meter guards exercised through integration tests.
				'**/admin/application/read/**',
				// SSE infrastructure — branch coverage requires actual streaming with timing.
				'**/sse/**',
				// Outbound HTTP clients — branches map to connection failures.
				'**/common/net/ApacheHttpFetcher*.class',
				// Read services — exercised end-to-end via controller tests rather than
				// unit-branch tested in isolation.
				'**/application/read/MyLinksQueryService*.class',
				'**/application/read/ProfileQueryService*.class',
				'**/application/read/LinkStatsDimensionBreakdownsReader*.class',
				// Heavy aggregation services with branch-dense metric collection paths
				// covered by SpringBoot integration.
				'**/admin/application/RecentErrorsBuffer*.class',
				// OG scraper relies on jsoup + remote HTML — integration tested.
				'**/og/application/OgScraper*.class',
				// Servlet filters and security infrastructure — branches map to request
				// states (auth tokens / IPs / headers) that need MockMvc-level integration.
				'**/common/web/RateLimitFilter*.class',
				'**/common/web/BodySizeFilter*.class',
				'**/common/web/MdcFilter*.class',
				'**/common/web/ClientIp*.class',
				'**/common/security/**',
				'**/common/cache/**',
				'**/common/lock/**',
				'**/common/pow/**',
				'**/common/jpa/**',
				// Webhook delivery infra (HTTP client / batch buffer / gate) requires
				// real Redis + HTTP server to exercise branches end-to-end.
				'**/webhook/scheduler/WebhookHttpDeliveryClient*.class',
				'**/webhook/scheduler/WebhookBatchBuffer*.class',
				'**/webhook/scheduler/WebhookDeliveryGate*.class',
				// SSE stream registry — branches require live connections.
				'**/stats/presentation/sse/**',
				// User OAuth/JWT presentation security — branches map to provider config.
				'**/user/presentation/security/**',
				'**/user/presentation/oauth/**',
]

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: coverageClassExcludes)
		}))
	}
	// Chain the gate onto the report (which runs as a `test` finalizer). CI runs the gate
	// during `./gradlew test`; the later `./gradlew build -x test` step skips test — and
	// therefore this finalizer — so the gate never runs without coverage data.
	finalizedBy jacocoTestCoverageVerification
}

// Ratchet gate: floors are pinned to the current measured baseline
// (instruction 93.8%, branch 84.1%) so coverage can only hold or rise.
// Raise these numbers when a track lands new tests — never lower them.
jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				minimum = 0.93
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				// Defensive guard-clause code (input validation, fail-fast config guards, magic-byte
				// checks) is branch-dense with hard-to-reach arms; instruction coverage holds at 0.93.
				minimum = 0.83
			}
		}
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: coverageClassExcludes)
		}))
	}
}

spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat('1.36.1')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

pmd {
	toolVersion = '7.28.0'
	ignoreFailures = true
	consoleOutput = false
	ruleSets = []
	ruleSetFiles = files('config/pmd/size-rules.xml')
}

tasks.named('pmdTest') {
	enabled = false
}

def pmdSizeBaseline = file('config/pmd/size-baseline.txt')

def pmdSizeFindings = {
	def report = tasks.named('pmdMain').get().reports.xml.outputLocation.get().asFile
	def root = projectDir.toPath()
	def found = [:]
	new groovy.xml.XmlSlurper().parse(report).file.each { f ->
		def path = root.relativize(new File(f.@name.toString()).toPath()).toString()
		f.violation.each { v ->
			def message = v.text().trim()
			def quoted = message =~ /'([^']*)'/
			def scope = quoted.find() ? quoted.group(1) : (v.@method.toString() ?: v.@class.toString())
			def measured = message.replaceAll(/'[^']*'/, '') =~ /\d+/
			def value = measured.find() ? measured.group() as long : 1L
			def key = "${v.@rule}|${path}|${scope}"
			def n = 1
			while (found.containsKey("${key}#${n}".toString())) n++
			found["${key}#${n}".toString()] = value
		}
	}
	found
}

tasks.register('pmdSizeRatchet') {
	group = 'verification'
	description = 'Fail when a PMD size or complexity finding differs from config/pmd/size-baseline.txt.'
	dependsOn 'pmdMain'
	inputs.file(pmdSizeBaseline)
	doLast {
		def current = pmdSizeFindings()
		def baseline = [:]
		pmdSizeBaseline.eachLine { line ->
			def cut = line.lastIndexOf('=')
			baseline[line.substring(0, cut)] = line.substring(cut + 1) as long
		}
		def added = current.findAll { k, v -> !baseline.containsKey(k) }
		def grew = current.findAll { k, v -> baseline.containsKey(k) && v > baseline[k] }
		def shrank = current.findAll { k, v -> baseline.containsKey(k) && v < baseline[k] }
		def fixed = baseline.keySet() - current.keySet()
		logger.lifecycle("PMD size ratchet: current=${current.size()} baseline=${baseline.size()} new=${added.size()} grew=${grew.size()} shrank=${shrank.size()} fixed=${fixed.size()}")
		if (added || grew) {
			throw new GradleException("New or grown PMD size findings:\n" + (added + grew).collect { k, v -> "  ${k}=${v} (baseline ${baseline[k] ?: 'none'})" }.join('\n'))
		}
		if (shrank || fixed) {
			throw new GradleException("PMD size findings went down; run ./gradlew pmdSizeBaselineWrite and commit config/pmd/size-baseline.txt:\n" + (shrank.collect { k, v -> "  ${k}: ${baseline[k]} -> ${v}" } + fixed.collect { "  ${it}: fixed" }).join('\n'))
		}
	}
}

tasks.register('pmdSizeBaselineWrite') {
	group = 'verification'
	description = 'Rewrite config/pmd/size-baseline.txt from the current PMD size and complexity findings.'
	dependsOn 'pmdMain'
	doLast {
		pmdSizeBaseline.text = pmdSizeFindings().collect { k, v -> "${k}=${v}" }.sort().join('\n') + '\n'
	}
}

def commentBaseline = file('config/comments/comment-baseline.txt')

def lineCommentsIn = { String source ->
	char slash = '/' as char
	char star = '*' as char
	char quote = '"' as char
	char apostrophe = '\'' as char
	char backslash = '\\' as char
	char newline = '\n' as char
	int n = source.length()
	int count = 0
	int i = 0
	while (i < n) {
		char c = source.charAt(i)
		char next = i + 1 < n ? source.charAt(i + 1) : (char) 0
		if (c == slash && next == slash) {
			count++
			int end = source.indexOf('\n', i)
			i = end < 0 ? n : end + 1
		} else if (c == slash && next == star) {
			int end = source.indexOf('*/', i + 2)
			i = end < 0 ? n : end + 2
		} else if (c == quote && source.startsWith('"""', i)) {
			int j = i + 3
			while (j < n && !source.startsWith('"""', j)) {
				j += source.charAt(j) == backslash ? 2 : 1
			}
			i = j + 3
		} else if (c == quote || c == apostrophe) {
			int j = i + 1
			while (j < n && source.charAt(j) != c && source.charAt(j) != newline) {
				j += source.charAt(j) == backslash ? 2 : 1
			}
			i = j + 1
		} else {
			i++
		}
	}
	count
}

def commentLines = {
	def root = projectDir.toPath()
	def found = [:]
	fileTree('src/main/java') {
		include '**/*.java'
		exclude 'db/migration/**'
	}.each { f ->
		def count = lineCommentsIn(f.getText('UTF-8'))
		if (count > 0) {
			found[root.relativize(f.toPath()).toString()] = count
		}
	}
	found
}

tasks.register('commentRatchet') {
	group = 'verification'
	description = 'Fail when a file under src/main/java has more or fewer // comment lines than config/comments/comment-baseline.txt.'
	inputs.file(commentBaseline)
	doLast {
		def current = commentLines()
		def baseline = [:]
		commentBaseline.eachLine { line ->
			def cut = line.lastIndexOf('=')
			baseline[line.substring(0, cut)] = line.substring(cut + 1) as int
		}
		def grew = current.findAll { k, v -> v > (baseline[k] ?: 0) }
		def shrank = baseline.findAll { k, v -> (current[k] ?: 0) < v }
		logger.lifecycle("Comment ratchet: lines=${current.values().sum() ?: 0} files=${current.size()} baseline=${baseline.values().sum() ?: 0} grew=${grew.size()} shrank=${shrank.size()}")
		if (grew) {
			throw new GradleException("// comment lines grew. Explanatory comments are not allowed: a comment may only state an invariant or an external contract the code cannot show, and the reasoning goes in the commit message or PR body. To add such a constraint comment, raise that file's count in config/comments/comment-baseline.txt in the same PR so the comment shows up in review.\n" + grew.collect { k, v -> "  ${k}: ${baseline[k] ?: 0} -> ${v}" }.join('\n'))
		}
		if (shrank) {
			throw new GradleException("// comment lines went down; shrink the baseline: run ./gradlew commentBaselineWrite and commit config/comments/comment-baseline.txt.\n" + shrank.collect { k, v -> "  ${k}: ${v} -> ${current[k] ?: 0}" }.join('\n'))
		}
	}
}

tasks.register('commentBaselineWrite') {
	group = 'verification'
	description = 'Rewrite config/comments/comment-baseline.txt from the current // comment lines per file.'
	doLast {
		commentBaseline.parentFile.mkdirs()
		commentBaseline.text = commentLines().collect { k, v -> "${k}=${v}" }.sort().join('\n') + '\n'
	}
}

tasks.named('check') {
	dependsOn 'pmdSizeRatchet', 'commentRatchet'
}

pitest {
	pitestVersion = '1.30.1'
	junit5PluginVersion = '1.2.3'
	addJUnitPlatformLauncher = false
	targetClasses = [
		'com.example.short_link.notification.domain.policy.*',
		'com.example.short_link.federation.domain.foryou.*',
		'com.example.short_link.link.classifier.application.helper.*',
	]
	targetTests = [
		'com.example.short_link.notification.domain.policy.*',
		'com.example.short_link.federation.domain.foryou.*',
		'com.example.short_link.home.HomeRankVectorsTest',
		'com.example.short_link.link.classifier.application.helper.*',
	]
	excludedTestClasses = ['com.example.short_link.federation.domain.foryou.replay.*']
	threads = 4
	outputFormats = ['XML', 'HTML']
	timestampedReports = false
	jvmArgs = ['-Xmx1g']
	mutationThreshold = 93
}

tasks.register('downloadGeoLite2Asn') {
	description = 'Download MaxMind GeoLite2-ASN mmdb into src/main/resources/geoip'
	group = 'build setup'
	def outputDir = file('src/main/resources/geoip')
	def outputFile = new File(outputDir, 'GeoLite2-ASN.mmdb')
	outputs.file(outputFile)
	doLast {
		def licenseKey = System.getenv('MAXMIND_LICENSE_KEY')
		if (!licenseKey) {
			throw new GradleException('MAXMIND_LICENSE_KEY environment variable is required')
		}
		outputDir.mkdirs()
		def tarball = new File(temporaryDir, 'geolite2-asn.tar.gz')
		def url = "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${licenseKey}&suffix=tar.gz"
		ant.get(src: url, dest: tarball, verbose: false, retries: 2, skipexisting: false)
		def workDir = new File(temporaryDir, 'extract-asn')
		workDir.deleteDir()
		workDir.mkdirs()
		copy {
			from tarTree(resources.gzip(tarball))
			into workDir
		}
		def mmdb = fileTree(workDir).matching { include '**/GeoLite2-ASN.mmdb' }.singleFile
		mmdb.renameTo(outputFile)
	}
}

tasks.register('downloadGeoLite2') {
	description = 'Download MaxMind GeoLite2-City mmdb into src/main/resources/geoip'
	group = 'build setup'
	def outputDir = file('src/main/resources/geoip')
	def outputFile = new File(outputDir, 'GeoLite2-City.mmdb')
	outputs.file(outputFile)
	doLast {
		def licenseKey = System.getenv('MAXMIND_LICENSE_KEY')
		if (!licenseKey) {
			throw new GradleException('MAXMIND_LICENSE_KEY environment variable is required')
		}
		outputDir.mkdirs()
		def tarball = new File(temporaryDir, 'geolite2.tar.gz')
		def url = "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=${licenseKey}&suffix=tar.gz"
		def maxAttempts = 3
		def lastError = null
		for (int attempt = 1; attempt <= maxAttempts; attempt++) {
			try {
				ant.get(src: url, dest: tarball, verbose: false, retries: 2, skipexisting: false)
				lastError = null
				break
			} catch (Exception e) {
				lastError = e
				logger.warn("MaxMind download attempt {} of {} failed: {}", attempt, maxAttempts, e.message)
				if (attempt < maxAttempts) {
					Thread.sleep(2000L * attempt)
				}
			}
		}
		if (lastError != null) {
			if (outputFile.exists() && outputFile.length() > 0) {
				logger.warn("Falling back to existing {} after {} failed download attempts", outputFile, maxAttempts)
				return
			}
			def fallback = new File(outputDir, 'GeoLite2-City-Fallback.mmdb')
			if (fallback.exists() && fallback.length() > 0) {
				logger.warn("MaxMind download failed; using committed fallback {}", fallback)
				return
			}
			throw new GradleException("MaxMind download failed and no fallback mmdb present", lastError)
		}
		def workDir = new File(temporaryDir, 'extract')
		workDir.deleteDir()
		workDir.mkdirs()
		copy {
			from tarTree(resources.gzip(tarball))
			into workDir
		}
		def mmdb = fileTree(workDir).matching { include '**/GeoLite2-City.mmdb' }.singleFile
		mmdb.renameTo(outputFile)
	}
}
